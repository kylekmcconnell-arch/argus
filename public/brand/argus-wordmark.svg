<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 286 84" role="img" aria-labelledby="title desc">
  <title id="title">ARGUS</title>
  <desc id="desc">ARGUS wordmark with a cobalt evidence eye</desc>
