<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 286 84" role="img" aria-labelledby="title desc">
  <title id="title">ARGUS</title>
  <desc id="desc">ARGUS dark-mode wordmark with a cobalt evidence eye</desc>
  <defs>
    <linearGradient id="iris" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9EC5FF"/>
      <stop offset="0.45" stop-color="#3B67E8"/>
      <stop offset="1" stop-color="#1769E0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feColorMatrix in="blur" values="0 0 0 0 0.24 0 0 0 0 0.4 0 0 0 0 0.91 0 0 0 .38 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

