name: Report lane ownership

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, review_submitted, review_dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: report-lane-ownership-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report-lane-ownership:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the protected base policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1

      - name: Enforce report lane ownership
        run: node scripts/check-report-lane-ownership.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_LANE_ACTOR: ${{ github.event.pull_request.user.login }}
          REPORT_LANE_BASE_REF: ${{ github.event.pull_request.base.ref }}
          REPORT_LANE_PR_NUMBER: ${{ github.event.pull_request.number }}
