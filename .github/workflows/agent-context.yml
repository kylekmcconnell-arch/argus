name: Agent context

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  agent-context:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate agent context and routing
        run: node scripts/validate-agent-context.mjs
