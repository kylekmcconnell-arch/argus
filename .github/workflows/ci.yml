name: CI

on:
  push:
    branches: [main]
  pull_request:

# Main: cancel stacked in-progress runs of the same default-branch ref so
# duplicate failure emails do not pile up. PRs: unique-per-SHA group and no
# cancel-in-progress, so a later commit cannot hide a real failure.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # supabase start pulls ~10 images from ghcr.io. Anonymous pulls share one
      # allowance across every GitHub-hosted runner behind the same egress, and
      # on 2026-09-23 four consecutive runs died on "toomanyrequests" before a
      # test ran. Logging in with the job's own token moves the pulls onto a
      # per-account limit.
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Start isolated Supabase database
        run: |
          set -eu
          supabase stop --no-backup || true
          docker rm -f supabase_db_ARGUS 2>/dev/null || true

          attempt=1
          max_attempts=3
          until supabase start; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "supabase start failed after ${max_attempts} attempts"
              exit 1
            fi
            echo "supabase start failed (attempt ${attempt}/${max_attempts}); retrying..."
            supabase stop --no-backup || true
            docker rm -f supabase_db_ARGUS 2>/dev/null || true
            attempt=$((attempt + 1))
            sleep 5
          done

      - name: Executable Postgres persistence and activation gates
        run: npm run test:db

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Source-of-truth contract
        run: npm run truth:check

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (engine port fidelity + golden-set calibration)
        run: npm test

      - name: Calibration (verdict drift table)
        run: npm run calibrate

      - name: Deterministic release canary (no live providers)
        run: npm run canary:offline

      - name: Build (client typecheck + bundle)
        run: npm run build
