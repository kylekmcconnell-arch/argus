name: CI

on:
  push:
    branches: [main]
  pull_request:

# Main: cancel stacked in-progress runs of the same default-branch ref so
# duplicate failure emails do not pile up. PRs: unique-per-SHA group and no
# cancel-in-progress, so a later commit cannot hide a real failure.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # supabase start pulls ~10 images (dozens of layers) from ghcr.io in one
      # burst. On 2026-09-23 five consecutive runs died on "toomanyrequests:
      # allowed 44000/minute, retry-after <1ms" before a test ran - a burst
      # limit on parallel layer downloads, which a login alone did not clear.
      # Three measures: authenticate (per-account allowance), cap the docker
      # daemon's parallel downloads so the burst is smaller, and retry with
      # exponential backoff instead of three quick attempts.
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Throttle docker image downloads
        run: |
          set -eu
          echo '{"max-concurrent-downloads": 2}' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl restart docker

      - name: Start isolated Supabase database
        run: |
          set -eu
          supabase stop --no-backup || true
          docker rm -f supabase_db_ARGUS 2>/dev/null || true

          attempt=1
          max_attempts=6
          delay=10
          until supabase start; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "supabase start failed after ${max_attempts} attempts"
              exit 1
            fi
            echo "supabase start failed (attempt ${attempt}/${max_attempts}); retrying in ${delay}s..."
            supabase stop --no-backup || true
            docker rm -f supabase_db_ARGUS 2>/dev/null || true
            attempt=$((attempt + 1))
            sleep "$delay"
            delay=$((delay * 2))
          done

      - name: Executable Postgres persistence and activation gates
        run: npm run test:db

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Source-of-truth contract
        run: npm run truth:check

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (engine port fidelity + golden-set calibration)
        run: npm test

      - name: Calibration (verdict drift table)
        run: npm run calibrate

      - name: Deterministic release canary (no live providers)
        run: npm run canary:offline

      - name: Build (client typecheck + bundle)
        run: npm run build
