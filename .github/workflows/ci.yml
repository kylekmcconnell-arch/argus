name: CI

on:
  push:
    branches: [main]
  pull_request:

# Main: cancel stacked in-progress runs of the same default-branch ref so
# duplicate failure emails do not pile up. PRs: unique-per-SHA group and no
# cancel-in-progress, so a later commit cannot hide a real failure.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Job-wide, not just on the start step: `supabase test db` pulls pg_prove
    # too, and on 2026-09-23 that single ghcr.io pull failed the job after
    # every other image had come from the mirror.
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # supabase start pulls ~10 images (dozens of layers) from ghcr.io in one
      # burst. On 2026-09-23 five consecutive runs died on "toomanyrequests:
      # allowed 44000/minute, retry-after <1ms" before a test ran - a burst
      # limit on parallel layer downloads, which a login alone did not clear.
      # Four measures: authenticate (per-account allowance), cap the docker
      # daemon's parallel downloads so the burst is smaller, retry with
      # exponential backoff instead of three quick attempts, and pull from
      # the ECR Public mirror instead of ghcr.io (set on the start step).
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Throttle docker image downloads
        run: |
          set -eu
          echo '{"max-concurrent-downloads": 2}' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl restart docker

      # The pinned CLI resolves images to ghcr.io regardless of the override
      # in some runs (observed 2026-09-23), and `test db` hard-codes
      # ghcr.io/supabase/pg_prove. Stage every pinned image from the ECR
      # mirror with backoff and tag it under the ghcr name, so the daemon
      # already holds whatever name the CLI asks for. A miss here is not
      # fatal: supabase start keeps its own retry loop.
      - name: Stage Supabase images from the mirror
        run: |
          set -u
          images="postgres:17.6.1.143 postgres-meta:v0.96.6 logflare:1.46.0 storage-api:v1.62.5 realtime:v2.112.6 vector:0.53.0-alpine imgproxy:v3.8.0 mailpit:v1.30.2 gotrue:v2.192.0 edge-runtime:v1.74.2 studio:2026.07.06-sha-66cf431 postgrest:v14.14 pg_prove:3.36"
          for image in $images; do
            delay=5
            for try in 1 2 3 4 5; do
              if docker pull "public.ecr.aws/supabase/$image" >/dev/null 2>&1; then
                docker tag "public.ecr.aws/supabase/$image" "ghcr.io/supabase/$image"
                echo "staged $image"
                break
              fi
              echo "pull of $image throttled (try $try); waiting ${delay}s"
              sleep "$delay"; delay=$((delay * 2))
            done
          done

      - name: Start isolated Supabase database
        # The pinned CLI defaults to ghcr.io; the same images are mirrored to
        # ECR Public (the registry newer CLIs default to), on a separate
        # allowance - see the job env. Every pinned tag was checked there.
        run: |
          set -eu
          supabase stop --no-backup || true
          docker rm -f supabase_db_ARGUS 2>/dev/null || true

          attempt=1
          max_attempts=6
          delay=10
          until supabase start; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "supabase start failed after ${max_attempts} attempts"
              exit 1
            fi
            echo "supabase start failed (attempt ${attempt}/${max_attempts}); retrying in ${delay}s..."
            supabase stop --no-backup || true
            docker rm -f supabase_db_ARGUS 2>/dev/null || true
            attempt=$((attempt + 1))
            sleep "$delay"
            delay=$((delay * 2))
          done

      - name: Executable Postgres persistence and activation gates
        run: npm run test:db

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Source-of-truth contract
        run: npm run truth:check

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (engine port fidelity + golden-set calibration)
        run: npm test

      - name: Report acceptance (people, shared views, exports and holders)
        run: npm run acceptance:reports

      - name: Calibration (verdict drift table)
        run: npm run calibrate

      - name: Deterministic release canary (no live providers)
        run: npm run canary:offline

      - name: Build (client typecheck + bundle)
        run: npm run build
