name: CI

on:
  push:
    branches: [main]
  pull_request:

# Keep exactly one active run per branch or pull request. Superseded commits
# are still visible in GitHub history, but they do not consume runners or send
# a backlog of failure notifications after a newer commit has replaced them.
# The newest commit always runs the complete suite and remains authoritative.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start isolated Supabase database
        run: |
          set -eu
          supabase stop --no-backup || true
          docker rm -f supabase_db_ARGUS 2>/dev/null || true

          attempt=1
          max_attempts=3
          until supabase start; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "supabase start failed after ${max_attempts} attempts"
              exit 1
            fi
            echo "supabase start failed (attempt ${attempt}/${max_attempts}); retrying..."
            supabase stop --no-backup || true
            docker rm -f supabase_db_ARGUS 2>/dev/null || true
            attempt=$((attempt + 1))
            sleep 5
          done

      - name: Executable Postgres persistence and activation gates
        run: npm run test:db

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Source-of-truth contract
        run: npm run truth:check

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (engine port fidelity + golden-set calibration)
        run: npm test

      - name: Calibration (verdict drift table)
        run: npm run calibrate

      - name: Deterministic release canary (no live providers)
        run: npm run canary:offline

      - name: Build (client typecheck + bundle)
        run: npm run build
